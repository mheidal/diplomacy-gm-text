[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "dipgm"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "click>=8.3.2",
    "platformdirs>=4.9.4",
    "tzdata>=2026.1",
]

[project.scripts]
dipgm = "dipgm.cli:cli"

[tool.setuptools]
packages = ["dipgm", "dipgm.models"]
